<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Faculty Management — EduAttend</title>
  <link rel="stylesheet" href="css/style.css"/><link rel="stylesheet" href="css/dashboard.css"/>
</head>
<body>
<div class="page-bg"></div><div class="grid-overlay"></div><div id="toast-container"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">EA</div>
      <div class="sidebar-brand-text"><div class="sidebar-brand-name">EduAttend</div><div class="sidebar-brand-sub">Admin Panel</div></div>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-section-label">Main</span>
      <a href="admin-dashboard.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
      <a href="students.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Students</a>
      <a href="faculty.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>Faculty</a>
    </nav>
    <div class="sidebar-footer"><div class="sidebar-user" onclick="logout()"><div class="avatar avatar-md" style="background:linear-gradient(135deg,var(--primary),var(--accent));color:white">AD</div><div class="sidebar-user-info"><div class="sidebar-user-name">Admin</div><div class="sidebar-user-role">Administrator</div></div></div></div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left"><button class="hamburger" id="hamburger" title="Menu"><span></span><span></span><span></span></button><div><div class="topbar-title">Faculty Management</div><div class="topbar-subtitle">View and manage all faculty members</div></div></div>
      <div class="topbar-right"><button class="btn btn-primary btn-sm" onclick="openModal('addModal')">+ Add Faculty</button><div class="avatar avatar-md" style="background:linear-gradient(135deg,var(--primary),var(--accent));color:white">AD</div></div>
    </header>

    <main class="content-area">
      <div class="page-header animate-fade-in-up"><div><h1 class="page-title">All <span class="gradient-text">Faculty</span></h1><p class="page-subtitle">Manage faculty accounts and department assignments</p></div></div>
      <div class="filter-bar animate-fade-in-up delay-1">
        <input type="text" class="form-control" placeholder="Search by name or code..." id="searchInput" style="max-width:300px" oninput="filterFaculty()"/>
        <select class="form-control" id="fDeptFilter" title="Department" onchange="filterFaculty()"><option value="">All Departments</option></select>
        <span style="margin-left:auto;font-size:13px;color:var(--text-muted)" id="countLabel">0 faculty</span>
      </div>
      <div class="student-grid animate-fade-in-up delay-2" id="facultyGrid"></div>
    </main>
  </div>
</div>

<!-- ADD MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">Add New Faculty</div><button class="modal-close" data-modal-close>✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Full Name</label><input type="text" class="form-control" id="mName" placeholder="Dr. Satish Sharma"/></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-control" id="mEmail" placeholder="satish@college.edu"/></div>
      <div class="form-group"><label class="form-label">Faculty Code</label><input type="text" class="form-control" id="mCode" placeholder="FAC001"/></div>
      <div class="form-group"><label class="form-label">Department</label><select title="Department" class="form-control" id="mDept"><option value="">Select Department</option></select></div>
      <div class="form-group"><label class="form-label">Designation</label><input type="text" class="form-control" id="mDesignation" placeholder="Assistant Professor"/></div>
    </div>
    <div class="modal-footer"><button class="btn btn-outline" data-modal-close>Cancel</button><button class="btn btn-primary" onclick="submitAddFaculty()">Save Faculty</button></div>
  </div>
</div>

<script src="js/main.js"></script>
<script>
let allFaculty = [];
async function fetchData() {
  const token = localStorage.getItem('ea_token');
  try {
    const [facRes, deptRes] = await Promise.all([
      fetch('http://localhost:3000/api/faculty', { headers: { 'Authorization': `Bearer ${token}` } }),
      fetch('http://localhost:3000/api/auth/departments')
    ]);
    allFaculty = await facRes.json();
    const depts = await deptRes.json();

    const fDept = document.getElementById('fDeptFilter');
    const mDept = document.getElementById('mDept');
    depts.forEach(d => {
      const opt = `<option value="${d.id}">${d.name}</option>`;
      fDept.innerHTML += opt;
      mDept.innerHTML += opt;
    });
    renderFaculty(allFaculty);
  } catch (err) { console.error(err); showToast('Failed to load faculty', 'danger'); }
}

function renderFaculty(list) {
  const grid = document.getElementById('facultyGrid');
  document.getElementById('countLabel').innerText = `${list.length} faculty`;
  if (list.length === 0) {
    grid.innerHTML = '<p class="text-muted text-center p-4 w-full">No faculty found.</p>';
    return;
  }
  grid.innerHTML = list.map(f => `
    <div class="panel p-4" style="display:flex;align-items:center;gap:16px;">
      <div class="avatar avatar-md" style="background:var(--accent-light);color:var(--accent)">${f.name[0]}</div>
      <div style="flex:1">
        <div style="font-weight:600">${f.name}</div>
        <div style="font-size:12px;color:var(--text-muted)">${f.faculty_code} · ${f.dept_name}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:14px;font-weight:600;color:var(--primary)">${f.designation}</div>
        <div style="font-size:12px;color:var(--text-muted)">${f.email}</div>
      </div>
    </div>
  `).join('');
}

function filterFaculty() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const dept = document.getElementById('fDeptFilter').value;
  const filtered = allFaculty.filter(f => {
    const matchQuery = f.name.toLowerCase().includes(query) || f.faculty_code.toLowerCase().includes(query);
    const matchDept = dept === "" || f.dept_id == dept;
    return matchQuery && matchDept;
  });
  renderFaculty(filtered);
}

async function submitAddFaculty() {
  const data = {
    name: document.getElementById('mName').value,
    email: document.getElementById('mEmail').value,
    faculty_code: document.getElementById('mCode').value,
    dept_id: document.getElementById('mDept').value,
    designation: document.getElementById('mDesignation').value,
    password: 'faculty123'
  };
  try {
    const res = await fetch('http://localhost:3000/api/admin/faculty', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('ea_token')}` },
      body: JSON.stringify(data)
    });
    const result = await res.json().catch(() => null);
    if (!res.ok) throw new Error(result?.error || 'Failed to add');
    showToast('Faculty added!', 'success');
    closeModal('addModal');
    fetchData();
  } catch (err) { showToast(err.message, 'danger'); }
}

document.addEventListener('DOMContentLoaded', fetchData);
</script>
</body></html>
